<dialog class="dialogo-modal"
        id="confirm-dialog"
        role="alertdialog"
        aria-labelledby="confirm-dialog-title"
        aria-describedby="confirm-dialog-message">
    <div class="dialogo-modal__corpo">
        <h2 class="dialogo-modal__titulo" id="confirm-dialog-title">Confirmar ação</h2>
        <p class="dialogo-modal__descricao" id="confirm-dialog-message">Revise esta ação antes de prosseguir com o procedimento jurídico.</p>
        <div class="dialogo-modal__acoes">
            <button type="button" class="botao botao--fantasma" data-modal-cancel>Cancelar</button>
            <button type="button" class="botao botao--primario" data-modal-accept>Confirmar</button>
        </div>
    </div>
</dialog>
